# Workspace-wide settings only. The ESP32 target, its runner, the backtrace
# rustflags and `build-std` live in firmware/.cargo/config.toml so they do not
# leak into the ui/web crates.

[env]
DEFMT_LOG = "info"

[build]
warnings = "deny"

[lints.clippy]
single_match = "warn"
single_match_else = "warn"
needless_match = "warn"
needless_late_init = "warn"
redundant_pattern_matching = "warn"
redundant_pattern = "warn"
redundant_guards = "warn"
collapsible_match = "warn"
match_single_binding = "warn"
match_same_arms = "warn"
match_ref_pats = "warn"
match_bool = "warn"
needless_bool = "deny"
unwrap_used = "warn"
expect_used = "warn"

[alias]
# firmware is a separate workspace; Cargo only reads `.cargo/config.toml` from
# the workspace root (cwd), so pass firmware's config explicitly to get the
# target and build-std. Equivalent to `cd firmware && cargo build`.
esp = "build --manifest-path firmware/Cargo.toml --config firmware/.cargo/config.toml"
web = "build --manifest-path web/Cargo.toml --target wasm32-unknown-unknown"