[package]
edition      = "2021"
name         = "firmware"
# rust-version = "1.88"
version      = "0.1.0"

# Standalone workspace: Cargo reads `.cargo/config.toml` per workspace root,
# and this crate needs its own (target + build-std). It is `exclude`d from the
# repo-root workspace for the same reason, so rust-analyzer can load it with
# the ESP32 target while `ui`/`web` stay on the host target.
[workspace]

[[bin]]
name = "display-co5300-test"
path = "./src/main.rs"

[dependencies]

# Slint itself is re-exported by the UI crate so the two hosts cannot end up on
# different renderers. `ui::slint` is the only way the firmware touches Slint.
ui = { path = "../ui" }

esp-hal = { version = "1.2.0", features = ["defmt", "esp32c6", "unstable", "rt"] }

esp-rtos = { version = "0.4.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp32c6",
] }

defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32c6"] }

# no_std (alloc-only) error propagation for the boot path.
anyhow = { version = "1.0", default-features = false }

embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }

esp-backtrace = { version = "0.20.0", features = [
  "defmt",
  "esp32c6",
  "panic-handler",
] }
esp-println = { version = "0.18.0", features = ["defmt-espflash", "esp32c6"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
display-driver = "0.1.0"
display-driver-qspi = "0.1.0"
display-driver-co5300 = "0.1.1"
embedded-hal = "1.0.0"
embedded-graphics = "0.8.2"

embedded-hal-async = "1.0.0"
embedded-hal-bus = "0.3.0"

# CST9220 capacitive touch controller. The shared I2C bus is driven through
# embedded-hal-bus' RefCellDevice, which only implements the blocking I2C trait,
# so the blocking driver is used instead of the default async one.
cst92xx = { version = "0.2.4", default-features = false, features = [
  "blocking",
  "defmt",
] }

embedded-alloc = { version = "0.5" }
bytemuck = { version = "1.15.0", features = ["derive"] }
embassy-futures = "0.1.2"

# firmware is its own workspace, so it needs the root's profiles copied here.
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = "z"
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"
overflow-checks = false

[lints.clippy]
single_match = "warn"
single_match_else = "warn"
needless_match = "warn"
needless_late_init = "warn"
redundant_pattern_matching = "warn"
redundant_pattern = "warn"
redundant_guards = "warn"
collapsible_match = "warn"
match_single_binding = "warn"
match_same_arms = "warn"
match_ref_pats = "warn"
match_bool = "warn"
needless_bool = "deny"
unwrap_used = "warn"
expect_used = "warn"
